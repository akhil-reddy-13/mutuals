<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mutuals stage</title>
<!--
  Pass 2 of the demo video. render.mjs loads the timeline that capture.mjs wrote and calls stage.render(t) for every
  frame. Nothing here runs on its own clock: every position, opacity and blur is a function of t, so frames come out
  identical every time and motion is perfectly even. Easing is ease-in-out or ease-out only (no springs, no overshoot).
-->
<style>
  :root {
    --blue: #0866ff; --purple: #a033ff; --pink: #ff5c87; --ink: #1d1d1f; --muted: #6e6e73; --bg: #f5f5f7;

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); font-family: var(--font); color: var(--ink); }
  .abs { position: absolute; left: 0; top: 0; }
  .full { position: absolute; inset: 0; }

  /* background: static soft colour, a few slow glass bubbles */

      radial-gradient(820px 720px at 104% 108%, rgba(199, 160, 255, .5), transparent 70%),

      var(--bg); }

  .scene { position: absolute; inset: 0; display: none; }
  .scene.dark { background: radial-gradient(1400px 900px at 30% 25%, #3b3346 0%, #17141d 55%, #0b0a0f 100%); color: #fff; }

  /* text */
  .h { position: absolute; font-weight: 700; letter-spacing: -.025em; line-height: 1.04; }
  .cap { position: absolute; color: var(--muted); line-height: 1.35; }
  .grad { background: var(--muse); -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* phone */
  #phone { position: absolute; left: 0; top: 0; width: 451px; height: 912px; transform-origin: 0 0; }
  #bezel { position: absolute; inset: 0; border-radius: 74px; padding: 15px;
    background: linear-gradient(145deg, #3a3a3e, #8a8a90 18%, #2c2c30 40%, #6d6d72 70%, #2a2a2e);
    box-shadow: 0 60px 120px rgba(30, 40, 90, .26), 0 18px 40px rgba(0,0,0,.16), inset 0 0 0 1.5px rgba(255,255,255,.25); }
  #screen { width: 421px; height: 882px; border-radius: 60px; overflow: hidden; background: #fff; position: relative; box-shadow: 0 0 0 4px #0b0b0c; }
  #status { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 8px 36px 0 44px; font-size: 17px; font-weight: 600; background: #fff; position: relative; }
  #status .island { position: absolute; left: 50%; top: 11px; width: 122px; height: 34px; margin-left: -61px; background: #0b0b0c; border-radius: 20px; }

  #status .bat { width: 26px; height: 13px; border: 2px solid #111; border-radius: 4px; position: relative; }

  .shotl { position: absolute; left: 0; top: 0; display: block; width: 421.2px; height: 838.08px; }

  /* stepper */
  #stepper { position: absolute; top: 30px; left: 0; width: 1920px; display: flex; justify-content: center; align-items: center; gap: 14px; }
  .step { position: relative; display: flex; align-items: center; gap: 10px; padding: 9px 20px 9px 10px; border-radius: 999px; font-size: 21px; font-weight: 600; color: var(--muted);

  .step .on { position: absolute; inset: 0; background: var(--muse); border-radius: 999px; }

  /* compose box */

  .compose .ring { width: 54px; height: 54px; border-radius: 50%; background: var(--muse); flex: none; display: flex; align-items: center; justify-content: center; }

  .compose .txt { flex: 1; font-size: 30px; line-height: 1.3; color: var(--ink); white-space: normal; overflow: hidden; height: 117px; padding-top: 8px; }
  .compose .txt .ph { color: #a1a1a6; }

  .compose .send svg { width: 30px; height: 30px; }

  /* Muse network */

  .node .nm { margin-top: 10px; font-size: 22px; font-weight: 700; }

  .dots { position: absolute; left: 50%; top: -34px; background: #fff; border-radius: 18px; padding: 8px 12px; display: flex; gap: 5px; box-shadow: 0 6px 18px rgba(0,0,0,.1); }
  .dots b { width: 8px; height: 8px; border-radius: 50%; background: #8e8e93; }

  /* graphics */
  .statement { position: absolute; left: 160px; width: 1600px; text-align: center; font-size: 104px; line-height: 1.05; font-weight: 700; letter-spacing: -.03em; }
  .gcap { position: absolute; left: 260px; width: 1400px; text-align: center; font-size: 40px; color: var(--muted); line-height: 1.3; }
  .num { position: absolute; font-size: 300px; font-weight: 800; letter-spacing: -.05em; line-height: .9; }
  .stattxt { position: absolute; font-size: 48px; font-weight: 600; line-height: 1.22; width: 680px; }
  .src { font-size: 20px; color: var(--muted); margin-top: 22px; font-weight: 400; }

  .msg { position: absolute; font-size: 46px; padding: 22px 34px; border-radius: 38px; max-width: 680px; white-space: nowrap; box-shadow: 0 14px 40px rgba(30,40,90,.09); }

  .lock { position: absolute; width: 74px; height: 74px; border-radius: 50%; background: var(--muse); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 30px rgba(160,51,255,.35); }

  .lring::after { content: ""; position: absolute; left: 27px; top: 27px; width: 96px; height: 96px; border-radius: 50%; background: var(--bg); }
  .wordmark { position: absolute; left: 0; width: 1920px; text-align: center; font-size: 172px; font-weight: 800; letter-spacing: -.045em; line-height: 1; }
  .model { position: absolute; width: 500px; padding: 42px 40px 38px; border-radius: 36px; background: rgba(255,255,255,.8); border: 1.5px solid rgba(255,255,255,.95); box-shadow: 0 20px 60px rgba(30,40,90,.11); }
  .model .d { width: 54px; height: 54px; border-radius: 50%; background: var(--muse); margin-bottom: 22px; }

    box-shadow: 0 30px 70px rgba(30,40,90,.12); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .act .ico { font-size: 120px; line-height: 1; }
  .act .lbl { font-size: 44px; font-weight: 700; letter-spacing: -.02em; }
  .act .where { font-size: 26px; color: var(--muted); font-weight: 600; padding: 6px 18px; border-radius: 999px; background: #eef0f4; }
  .post { position: absolute; width: 940px; border-radius: 28px; background: #fff; box-shadow: 0 30px 80px rgba(30,40,90,.14); padding: 34px 40px 30px; }
  .post .phd { display: flex; align-items: center; gap: 18px; }
  .post .phd img { width: 72px; height: 72px; border-radius: 50%; }
  .post .phd b { display: block; font-size: 30px; }
  .post .phd span { font-size: 22px; color: var(--muted); }
  .post .pbody { margin-top: 22px; font-size: 38px; line-height: 1.42; }
  .post mark { color: inherit; background: linear-gradient(90deg, rgba(255,92,135,.32), rgba(160,51,255,.28)) no-repeat 0 85% / 0% 42%; padding: 0 2px; }
  .post .pft { margin-top: 22px; padding-top: 18px; border-top: 1.5px solid #e4e6eb; font-size: 26px; color: var(--muted); font-weight: 600; }
  .anode { position: absolute; width: 96px; text-align: center; }
  .anode .av { position: relative; width: 96px; height: 96px; border-radius: 50%; padding: 4px; background: rgba(255,255,255,.9); box-shadow: 0 12px 30px rgba(30,40,90,.14); }
  .anode .av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
  .anode.me { width: 180px; } .anode.me .av { width: 180px; height: 180px; padding: 8px; background: var(--muse); }
  .anode .nm { margin-top: 12px; font-size: 26px; font-weight: 700; white-space: nowrap; }
  .anode .badge { width: 34px; height: 34px; font-size: 19px; }
  .fun { position: absolute; width: 860px; border-radius: 40px; background: rgba(255,255,255,.9); border: 1.5px solid rgba(255,255,255,.95); box-shadow: 0 40px 90px rgba(30,40,90,.15); padding: 44px 48px 40px; }
  .fun .fhd { display: flex; align-items: center; gap: 28px; }
  .fun .fav { width: 132px; height: 132px; border-radius: 50%; padding: 6px; background: var(--muse); }
  .fun .fav img { width: 100%; height: 100%; border-radius: 50%; display: block; object-fit: cover; }
  .fun .fnm { font-size: 54px; font-weight: 800; letter-spacing: -.02em; }

  .fun .sw { position: relative; width: 70px; height: 42px; border-radius: 999px; background: #d1d1d6; flex: none; }
  .fun .sw b { position: absolute; left: 4px; top: 4px; width: 34px; height: 34px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .rring { position: absolute; border-radius: 50%; border: 2px solid rgba(160,51,255,.22); background: radial-gradient(circle, rgba(255,255,255,.0) 60%, rgba(160,51,255,.05)); }
  .sweep { position: absolute; border-radius: 50%; background: conic-gradient(from 0deg, rgba(160,51,255,.0) 0deg, rgba(160,51,255,.14) 50deg, rgba(160,51,255,0) 60deg); }
  .rlab { position: absolute; width: 180px; text-align: center; font-size: 22px; font-weight: 700; color: #5a2db8; background: rgba(255,255,255,.9); border-radius: 999px; padding: 6px 12px; box-shadow: 0 4px 14px rgba(0,0,0,.06); }

  .vf i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; } .vf i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; }
  .vf i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; } .vf i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; }
  .kicker { position: absolute; left: 150px; top: 150px; font-size: 26px; letter-spacing: .16em; text-transform: uppercase; color: #c9b8ff; font-weight: 700; }

  /* video overlay: a clip (or its empty slot) behind the Muse chat */

// ------------------------------------------------------------------ frame lookup
function frameIndexAt(t) {
  let lo = 0, hi = FR.length - 1, best = 0;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (FR[mid].t <= t) { best = mid; lo = mid + 1; } else hi = mid - 1;
  }
  return best;
}

// ------------------------------------------------------------------ render one frame

        const m = v.inv

          style(e, r.o, 0, r.y);
          e.style.filter = bl > 0.001 ? `blur(${(bl * 9).toFixed(2)}px)` : "none";
          const rect = { x: parseFloat(e.style.left), y: parseFloat(e.style.top), w: e.offsetWidth, h: e.offsetHeight };
          it.lock.style.left = rect.x + rect.w / 2 - 37 + "px";
          it.lock.style.top = rect.y + rect.h / 2 - 37 + "px";
          const lo = env(t, it.lockAt + 0.15, 0.6, end, 0.45);
          style(it.lock, lo, 0, 0, lerp(0.85, 1, out(prog(t, it.lockAt + 0.15, 0.6))));
        } else if (it.kind === "fn") {
          const o = env(t, it.t, 0.01, end, 0.45);
          e.style.opacity = o.toFixed(4);
          e.style.visibility = o <= 0.001 ? "hidden" : "visible";
          if (o > 0.001) it.fn(t, 1);
        }
      }
    }
  },
  live(S, t) {
    style(S.action, env(t, S.start + 0.2, 0.8), 0, 0);
    for (const l of S.lines) {
      const o = env(t, l.t, 0.35, l.end != null ? l.end - 0.3 : null, 0.3);
      style(l.e, o, 0, (1 - out(prog(t, l.t, 0.35))) * 10);
    }
  },
  phone(S, t) {
    renderApp(S, t);
  },
  feature(S, t) {
    renderApp(S, t);
  },
  film(S, t) {
    const f = S.film;
    if (f?.media) setImg(S.img, mediaSrc(f.media, Math.floor((t - f.t) * f.media.fps)));
    const lt = t - (f?.t ?? S.start);
    for (const c of S.subs) style(c.e, env(lt, c.a - 0.05, 0.15, c.b, 0.15), 0, 0);
  },
  overlay(S, t) {
    if (S.clipImg) setImg(S.clipImg, mediaSrc(S.clip.media, Math.floor((t - S.clip.t) * S.clip.media.fps)));
    S.oheads.forEach((h, k) => {
      const r = RISE(h.t, t, S.oheads[k + 1]?.t ?? null);
      style(h.e, r.o, 0, r.y);
    });
    style(S.panel, env(t, S.start + 0.4, 0.8), 0, (1 - out(prog(t, S.start + 0.4, 0.9))) * 36);
    let last = -1;
    S.msgs.forEach((m, k) => {
      const on = t >= m.t;
      m.e.style.display = on ? "block" : "none";
      if (!on) return;
      last = k;
      const q = out(prog(t, m.t, 0.4));
      m.e.style.opacity = q.toFixed(3);
      m.e.style.transform = `translateY(${((1 - q) * 18).toFixed(1)}px)`;
    });
    const y = last < 0 ? 0 : lerp(S.scrolls[last - 1] ?? 0, S.scrolls[last], inOut(prog(t, S.msgs[last].t, 0.5)));
    S.pin.style.transform = `translateY(${(-y).toFixed(2)}px)`;
  },
};

function renderApp(S, t) {
  const ph = phoneAt(t);
  const away = S.kind === "feature" ? 1 : S.awayAt != null ? soft(prog(t, S.awayAt + 0.5, 1.3)) : 0;
  // the column to the right of the phone; with the phone gone, text moves to the top and spans the frame
  const phoneRight = ph.x + ph.k * PW;
  const colL = clamp(phoneRight + 90, 1000, 1200);
  const L = colL, Wd = 1840 - colL;
  // headline(s): each replaces the last. One copy sits beside the phone, one across the top; they crossfade when the
  // phone leaves, so the text never reflows or jumps mid-move.
  S.heads.forEach((h, k) => {
    const end = S.heads[k + 1]?.t ?? null;
    const r = RISE(h.t, t, end);
    h.e.style.left = colL + "px";
    h.e.style.width = 1840 - colL + "px";
    h.e.style.top = "140px";
    h.e.style.fontSize = "76px";
    style(h.e, r.o * (1 - away), 0, r.y);
    if (h.top) style(h.top, r.o * away, 0, r.y);
  });
  const headH = S.heads.length ? S.heads[0].e.offsetHeight : 0;
  S.caps.forEach((c, k) => {
    const r = RISE(c.t, t, S.caps[k + 1]?.t ?? null);
    c.e.style.left = colL + "px";
    c.e.style.width = Math.min(1840 - colL, 820) + "px";
    c.e.style.fontSize = "30px";
    c.e.style.top = 140 + headH + 22 + "px";
    style(c.e, r.o * (1 - away), 0, r.y);
    if (c.top) style(c.top, r.o * away, 0, r.y);
  });
  // stepper
  if (S.stepEls) {
    let active = 0, changed = S.start, prevActive = 0;
    for (const c of S.stepChanges) if (c.t <= t) { prevActive = active; active = c.n; changed = c.t; }
    const q = soft(prog(t, changed, 0.6));
    S.stepEls.forEach((p, k) => {
      const n = k + 1;
      const was = n === prevActive ? 1 : 0, is = n === active ? 1 : 0;
      const on = lerp(was, is, q);
      p.querySelector(".on").style.opacity = on.toFixed(3);
      p.style.color = on > 0.5 ? "#fff" : "#6e6e73";
      const i = p.querySelector("i");
      const done = n < active ? 1 : 0;
      i.style.background = on > 0.5 ? "rgba(255,255,255,.25)" : done ? "#1d1d1f" : "#e8e8ed";
      i.style.color = on > 0.5 || done ? "#fff" : "#6e6e73";
    });
  }
  // compose box + the message flying into the phone
  if (S.box) {
    const first = S.composes[0];
    const boxTop = 140 + headH + 64;
    const boxW = Math.min(Wd, 780);
    S.box.style.left = L + "px";
    S.box.style.top = boxTop + "px";
    S.box.style.width = boxW + "px";
    const lastLand = S.composes[S.composes.length - 1];
    const bo = env(t, first.t - 0.4, 0.6, lastLand.t + lastLand.typeDur + lastLand.flight + 1.2, 0.6);
    style(S.box, bo, 0, (1 - out(prog(t, first.t - 0.4, 0.6))) * 20);
    // typing
    let txt = "", typing = false;
    for (const c of S.composes) {
      const tSend = c.t + c.typeDur;
      if (t >= c.t && t < tSend) {
        typing = true;
        txt = c.text.slice(0, Math.round(c.text.length * clamp((t - c.t) / Math.max(0.2, c.typeDur - 0.25))));
      }
    }
    // caret: solid while typing, otherwise a slow soft pulse (no hard on/off). The text wraps in place, so nothing
    // slides sideways as it's typed.
    const caretO = typing ? 1 : 0.25 + 0.75 * (0.5 + 0.5 * Math.cos(t * 2 * Math.PI * 0.9));
    const caret = `<span class="caret" style="opacity:${caretO.toFixed(3)}"></span>`;
    S.boxText.innerHTML = txt ? `${esc(txt)}${caret}` : `<span class="ph">Message Muse</span>${caret}`;
    const box = S.boxText;
    // the send button presses gently when a message goes
    let press = 0;
    for (const c of S.composes) press = Math.max(press, Math.sin(Math.PI * prog(t, c.t + c.typeDur - 0.12, 0.3)));
    S.box.querySelector(".send").style.transform = `scale(${(1 - press * 0.07).toFixed(3)})`;
    // the sent message drops softly into its place in the chat, then hands over to the app's own bubble
    S.composes.forEach((c, k) => {
      const f = S.flies[k];
      const tSend = c.t + c.typeDur, tLand = tSend + c.flight;
      if (t < tSend || t > tLand + 0.5 || !c.target) { style(f, 0); return; }
      const fw = f.offsetWidth;
      const end = toStage(ph, c.target.x, c.target.y);
      const sc = (ph.k * S0 * c.target.width) / fw;
      const q = out(prog(t, tSend, c.flight));
      const o = Math.min(soft(prog(t, tSend, 0.3)), 1 - soft(prog(t, tLand, 0.4)));
      style(f, o, end.x, end.y - 70 * (1 - q), sc);
    });
    // the box lets go of the text as it's sent
    let fade = 1;
    for (const c of S.composes) {
      const tSend = c.t + c.typeDur;
      if (t >= tSend && t < tSend + 0.3) fade = 1 - soft(prog(t, tSend, 0.25));
    }
    box.style.opacity = fade.toFixed(3);
  }
  // taps: a soft ring that fades
  for (const tp of S.taps) {
    const q = prog(t, tp.t, 0.6);
    if (q <= 0 || q >= 1) { style(tp.el, 0); continue; }
    const pt = toStage(ph, tp.x, tp.y);
    const o = Math.sin(Math.PI * q) * 0.9 * ph.op;
    style(tp.el, o, pt.x - 30, pt.y - 30, lerp(0.85, 1.2, out(q)));
  }
  // cards: in a PHONE scene they lift out of the phone into the column; in a FEATURE scene they sit in a row
  if (S.pops.length) {
    if (S.kind === "feature" || away > 0.5) {
      const n = S.pops.length;
      const top = 92 + (S.heads[0]?.top?.offsetHeight ?? 90) + (S.caps.length ? 64 : 34);
      const availH = 1020 - top, availW = 1640, gap = 56;
      // tall cards show their top part (the part that matters) so the row can be big
      const CROP = 560;
      const nat = S.pops.map((p) => ({ w: p.rect.width, h: Math.min(p.rect.height, CROP), full: p.rect.height }));
      let sc = Math.min(2.2, ...nat.map((d) => availH / d.h));
      const totalW = (s) => nat.reduce((a, d) => a + d.w * s, 0) + gap * (n - 1);
      if (totalW(sc) > availW) sc = (availW - gap * (n - 1)) / nat.reduce((a, d) => a + d.w, 0);
      // The cards on screen stay centred: when the next one arrives, the row glides over to make room.
      const rowW = (m) => nat.slice(0, m).reduce((a, d) => a + d.w * sc, 0) + gap * (m - 1);
      let x = 960 - rowW(1) / 2;
      for (let m = 2; m <= n; m++) x -= ((rowW(m) - rowW(m - 1)) / 2) * inOut(prog(t, S.pops[m - 1].t - 0.15, 0.9));
      S.pops.forEach((p, k) => {
        const w = nat[k].w * sc, h = nat[k].h * sc;
        const y = top + (availH - h) / 2;
        const o = env(t, p.t, 0.8);
        const rise = (1 - out(prog(t, p.t, 0.9))) * 40;
        const drift = 1; // no slow zoom on cards: rescaling text every frame shimmers
        p.el.style.width = w + "px";
        p.el.style.height = h + "px";
        p.img.style.height = (nat[k].full * sc) + "px";
        if (nat[k].full > nat[k].h + 2 || p.clipped) p.el.style.webkitMaskImage = p.el.style.maskImage = "linear-gradient(#000 80%, transparent)";
        style(p.el, o, x - (w * (drift - 1)) / 2, y + rise, drift);
        x += w + gap;
      });
    } else {
      let y = 140 + headH + 70;
      S.pops.forEach((p) => {
        const w = Math.min(Math.max(520, p.rect.width * S0 * 1.6), 660, 1820 - L);
        const h = (w * p.rect.height) / p.rect.width;
        // it starts exactly where it sat on the phone when it was captured
        const at = phoneAt(p.t);
        const start = toStage(at, p.rect.x, p.rect.y);
        const w0 = p.rect.width * S0 * at.k;
        const q = inOut(prog(t, p.t, 0.95));
        const x = lerp(start.x, L, q), yy = lerp(start.y, y, q), ww = lerp(w0, w, q);
        p.el.style.width = ww + "px";
        p.el.style.height = (ww * p.rect.height) / p.rect.width + "px";
        style(p.el, t < p.t ? 0 : Math.min(1, out(prog(t, p.t, 0.25))), x, yy);
        p.el.style.boxShadow = `0 ${(10 + 30 * q).toFixed(0)}px ${(30 + 60 * q).toFixed(0)}px rgba(30,40,90,${(0.12 + 0.12 * q).toFixed(3)})`;
        y += h + 26;
      });
    }
  }
  // the Muse network
  if (S.net) {
    const first = S.nets[0].t;
    const cx = lerp(Math.max(colL, 1010) + 400, 960, away), cy = lerp(650, 610, away), sc = lerp(1, 1.22, away);
    S.net.style.opacity = env(t, first, 0.6).toFixed(3);
    S.net.style.transform = `translate(${(cx - 400).toFixed(1)}px, ${(cy - 320).toFixed(1)}px) scale(${sc.toFixed(4)})`;
    // the state each node is in at time t, and when it got there
    const stateAt = new Map();
    for (const n of S.nets) {
      if (n.t > t) break;
      for (const x of n.nodes) {
        const prevS = stateAt.get(x.id);
        if (!prevS || prevS.phase !== x.phase) stateAt.set(x.id, { phase: x.phase, since: n.t, prev: prevS?.phase ?? null, speaker: x.speaker, oneSided: x.oneSided });
        else prevS.speaker = x.speaker;
      }
    }
    for (const [id, nd] of S.nodes) {
      const app = nd.me ? first : nd.first;
      const o = env(t, app, 0.6);
      style(nd.el, o, -0, (1 - out(prog(t, app, 0.6))) * 16);
      if (nd.me) continue;
      const s = stateAt.get(id);
      if (nd.line) {
        const len = Math.hypot(nd.x - 400, nd.y + 56 - 510);
        nd.line.setAttribute("stroke-dasharray", `${len}`);
        nd.line.setAttribute("stroke-dashoffset", `${(len * (1 - out(prog(t, app + 0.1, 0.7)))).toFixed(1)}`);
        const gray = s?.phase === "nofit" ? soft(prog(t, s.since, 0.6)) : 0;
        nd.line.setAttribute("opacity", (0.9 - gray * 0.55).toFixed(3));
      }
      const phase = s?.phase ?? "reaching";
      const fitQ = phase === "fit" ? out(prog(t, s.since, 0.5)) : 0;
      const noQ = phase === "nofit" ? soft(prog(t, s.since, 0.6)) : 0;
      nd.el.querySelector(".av img").style.filter = noQ > 0.001 ? `grayscale(${noQ.toFixed(3)}) opacity(${(1 - noQ * 0.45).toFixed(3)})` : "none";
      nd.el.querySelector(".nm").style.color = noQ > 0.5 ? "#8e8e93" : "#1d1d1f";
      nd.el.querySelector(".av").style.boxShadow = `0 0 0 ${(6 * fitQ).toFixed(1)}px rgba(49,162,76,${(0.25 * fitQ).toFixed(3)}), 0 16px 40px rgba(30,40,90,.15)`;
      const badge = nd.el.querySelector(".badge");
      const bq = Math.max(fitQ, noQ);
      badge.textContent = phase === "fit" ? "✓" : phase === "nofit" ? "✕" : "";
      badge.style.background = phase === "fit" ? "#31a24c" : "#8e8e93";
      style(badge, bq, 0, 0, lerp(0.8, 1, bq));
      // status text crossfade
      const label = (ph) => (ph === "fit" ? (s?.oneSided ? "Fits · from her post" : "Fits") : ph === "nofit" ? "Not a fit" : ph === "talking" ? (s?.oneSided ? "Reading her post" : "Talking") : "Reaching…");
      const [a, b2] = [nd.el.querySelector(".st .a"), nd.el.querySelector(".st .b")];
      const q = s ? soft(prog(t, s.since, 0.4)) : 1;
      a.textContent = label(s?.prev ?? "reaching");
      b2.textContent = label(phase);
      b2.className = "b" + (phase === "fit" ? " fitc" : "");
      a.style.opacity = (1 - q).toFixed(3);
      b2.style.opacity = q.toFixed(3);
      // while the Muses talk: soft typing dots, and light flowing along the line toward whoever is listening
      const talking = phase === "talking" ? soft(prog(t, s.since, 0.4)) : phase === "reaching" ? 0 : 1 - soft(prog(t, s.since, 0.4));
      const dots = nd.el.querySelector(".dots");
      dots.style.opacity = (talking * o).toFixed(3);
      dots.style.transform = "translateX(-50%)";
      [...dots.children].forEach((d, k) => (d.style.opacity = (0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * 3.2 - k * 0.9))).toFixed(3)));
      if (nd.flow) {
        const fromMe = s?.speaker === "me";
        nd.flow.setAttribute("opacity", (0.85 * talking).toFixed(3));
        nd.flow.setAttribute("stroke-dashoffset", ((fromMe ? -1 : 1) * t * 70).toFixed(2));
      }
    }
  }
}
</script>
</body>
</html>

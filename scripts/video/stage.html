<!--
  Pass 2 of the demo video. render.mjs loads the timeline that capture.mjs wrote and calls stage.render(t) for every
  frame. Nothing here runs on its own clock: every position, opacity and blur is a function of t, so frames come out
  identical every time and motion is perfectly even. Easing is ease-in-out or ease-out only (no springs, no overshoot).
-->
<style>

<body>
<div id="bg" class="full"></div>
<div id="glass" class="full"></div>
<div id="under" class="full"></div>
<div id="phone"><div id="bezel"><div id="screen">
  <div id="status"><span>9:41</span><span class="island"></span><span class="icons">5G <span class="bat"></span></span></div>
  <div style="position:relative;width:421.2px;height:838.08px"><img id="shot0" class="shotl" alt=""><img id="shot" class="shotl" alt=""></div>
</div></div></div>
<div id="over" class="full"></div>
<div id="veil"></div>

<script>
// ------------------------------------------------------------------ helpers
const W = 1920, H = 1080, S0 = 1.08, BEZ = 15, STATUS = 44, PW = 451, PH = 912;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const inOut = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const out = (p) => 1 - Math.pow(1 - p, 3);
const soft = (p) => 0.5 - Math.cos(Math.PI * p) / 2; // sine in-out, the gentlest
const prog = (t, t0, d) => (d <= 0 ? (t >= t0 ? 1 : 0) : clamp((t - t0) / d));
/** 0 before `a`, eases to 1 over `din`; eases back to 0 from `b` over `dout` (if b given). */
const env = (t, a, din, b, dout) => Math.min(out(prog(t, a, din)), b == null ? 1 : 1 - inOut(prog(t, b, dout)));
const el = (tag, cls, parent, html) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  (parent ?? document.body).appendChild(e);
  return e;
};
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
const fmt = (s) => esc(s).replace(/~(.+?)~/g, '<span class="grad">$1</span>').replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
const plain = (s) => String(s).replace(/[~*]/g, "");
const style = (e, o, tx = 0, ty = 0, s = 1, extra = "") => {
  e.style.opacity = o.toFixed(4);
  e.style.transform = `translate(${tx.toFixed(2)}px, ${ty.toFixed(2)}px) scale(${s.toFixed(4)})${extra}`;
  e.style.visibility = o <= 0.001 ? "hidden" : "visible";
};
const SEND_SVG = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10.2 15 12 3.4 13.8z"/></svg>';
const LOCK_SVG = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9h-2zm-8 0V7a3 3 0 0 1 6 0v2H9z"/></svg>';

// ------------------------------------------------------------------ state built in load()
let TL, BASE, FR = [], scenes = [], phoneKeys = [], stepsByScene = new Map();
const TD = { cut: 0.5, smash: 0.45, dissolve: 0.9, match: 0.6, wipe: 1.25, fade: 1.3 };
const kindOf = (t = "") => (/BUBBLE|WIPE|IRIS/.test(t) ? "wipe" : /SMASH/.test(t) ? "smash" : /MATCH/.test(t) ? "match" : /DISSOLVE/.test(t) ? "dissolve" : /FADE/.test(t) ? "fade" : "cut");
const isApp = (s) => s.kind === "phone" || s.kind === "feature";

// background glass bubbles (positions are a function of t)
const GLASS = Array.from({ length: 14 }, (_, i) => ({ size: 34 + ((i * 37) % 100), x: (i * 131 + 40) % 1880, y0: (i * 271) % 1300, speed: 9 + ((i * 7) % 10), sway: 10 + (i % 4) * 6, ph: i * 1.7 }));
const glassEls = GLASS.map((g) => {
  const e = el("div", "glass", document.getElementById("glass"));
  e.style.width = e.style.height = g.size + "px";
  return e;
});

// ------------------------------------------------------------------ phone camera
const LAYOUT = {
  center: { cx: 960, cy: 540 },
  left: { cx: 620, cy: 540 },
  right: { cx: 1300, cy: 540 },
};
function layoutState(pos) {
  if (pos === "away") return { x: -PW - 80, y: 540 - PH / 2, k: 1, op: 0 };
  const L = LAYOUT[pos] ?? LAYOUT.left;
  return { x: L.cx - PW / 2, y: L.cy - PH / 2, k: 1, op: 1 };
}
function zoomState(rect, pos) {
  const L = LAYOUT[pos] ?? LAYOUT.left;
  const fx = rect.x + rect.width / 2, fy = rect.y + rect.height / 2;
  const maxW = pos === "center" ? 1000 : 620;
  // in the left layout the zoomed screen must end before the text column (x ~1090)
  const room = pos === "center" ? 9 : (1090 - L.cx) / (PW - BEZ - fx * S0);
  const k = clamp(Math.min(maxW / (rect.width * S0), room, 2.0), 1.25, 2.0);
  const cy = clamp(540, 120 + (rect.height * S0 * k) / 2, 960 - (rect.height * S0 * k) / 2);
  return { x: L.cx - k * (BEZ + fx * S0), y: cy - k * (BEZ + STATUS + fy * S0), k, op: 1 };
}
/** The phone's state at time t: keyframes eased one after another (a new move starts from wherever the last one is). */
function phoneAt(t) {
  let seg = { from: layoutState("center"), to: layoutState("center"), t0: 0, d: 0 };
  const val = (s, tt) => {
    const p = inOut(prog(tt, s.t0, s.d));
    return { x: lerp(s.from.x, s.to.x, p), y: lerp(s.from.y, s.to.y, p), k: lerp(s.from.k, s.to.k, p), op: lerp(s.from.op, s.to.op, p) };
  };
  for (const kf of phoneKeys) {
    if (kf.t > t) break;
    seg = { from: kf.jump ? kf.state : val(seg, kf.t), to: kf.state, t0: kf.t, d: kf.jump ? 0 : kf.d };
  }
  return val(seg, t);
}
const toStage = (s, px, py) => ({ x: s.x + s.k * (BEZ + px * S0), y: s.y + s.k * (BEZ + STATUS + py * S0) });

// ------------------------------------------------------------------ load
window.stage = {
  async load(tl, base) {
    TL = tl;
    BASE = base;
    FR = tl.frames;
    const under = document.getElementById("under"), over = document.getElementById("over");
    // phone keyframes
    let lastPos = "left";
    let prevApp = false;
    for (const sc of tl.scenes) {
      const evs = sc.events;
      if (!isApp(sc)) {
        prevApp = false;
        continue;
      }
      const side = evs.some((e) => ["super", "caption", "pop", "compose", "net"].includes(e.type));
      let pos = sc.kind === "feature" ? "away" : side ? "left" : "center";
      const first = evs.find((e) => e.type === "phone" && e.t <= sc.start + 0.05);
      if (first) pos = first.pos;
      phoneKeys.push({ t: sc.start, state: layoutState(pos), d: 1.3, jump: !prevApp && pos !== "away" });
      lastPos = pos;
      for (const e of evs) {
        if (e.type === "phone" && e.t > sc.start + 0.05) {
          lastPos = e.pos;
          phoneKeys.push({ t: e.t, state: layoutState(e.pos), d: 1.5 });
        } else if (e.type === "zoom") phoneKeys.push({ t: e.t, state: zoomState(e.rect, lastPos === "center" ? "center" : "left"), d: 1.6 });
        else if (e.type === "unzoom") phoneKeys.push({ t: e.t, state: layoutState(lastPos), d: 1.4 });
      }
      // a zoom always lets go before the scene ends
      const lastZoom = [...evs].reverse().find((e) => e.type === "zoom" || e.type === "unzoom");
      if (lastZoom?.type === "zoom") phoneKeys.push({ t: Math.max(lastZoom.t + 1.4, sc.end - 1.1), state: layoutState(lastPos), d: 1.1 });
      prevApp = true;
    }
    phoneKeys.sort((a, b) => a.t - b.t);
    // scenes
    let steps = [];
    for (const [i, sc] of tl.scenes.entries()) {
      const u = el("div", "scene" + (sc.kind === "live" ? " dark" : ""), under);
      const o = el("div", "scene", over);
      const S = { ...sc, i, under: u, over: o, items: [], tIn: kindOf(sc.transitionIn), dIn: i === 0 ? 1.1 : TD[kindOf(sc.transitionIn)] };
      if (S.tIn === "cut" && i > 0 && isApp(sc) && isApp(tl.scenes[i - 1])) S.dIn = 0.55;
      for (const e of sc.events) if (e.type === "steps") steps = e.list;
      S.steps = steps;
      u.style.display = o.style.display = "block"; // so text can be measured while laying out
      BUILD[sc.kind](S);
      u.style.display = o.style.display = "none";
      scenes.push(S);
    }
    // images: wait for every pop and avatar before frame 0
    await Promise.all([...document.images].map((im) => (im.complete ? Promise.resolve() : im.decode().catch(() => {}))));
    return { scenes: scenes.length, duration: tl.duration };
  },
  render,
};

      style(nd.el, o, -0, (1 - out(prog(t, app, 0.6))) * 16);
      if (nd.me) continue;
      const s = stateAt.get(id);
      if (nd.line) {
        const len = Math.hypot(nd.x - 400, nd.y + 56 - 510);
        nd.line.setAttribute("stroke-dasharray", `${len}`);
        nd.line.setAttribute("stroke-dashoffset", `${(len * (1 - out(prog(t, app + 0.1, 0.7)))).toFixed(1)}`);
        const gray = s?.phase === "nofit" ? soft(prog(t, s.since, 0.6)) : 0;
        nd.line.setAttribute("opacity", (0.9 - gray * 0.55).toFixed(3));
      }
      const phase = s?.phase ?? "reaching";
      const fitQ = phase === "fit" ? out(prog(t, s.since, 0.5)) : 0;
      const noQ = phase === "nofit" ? soft(prog(t, s.since, 0.6)) : 0;
      nd.el.querySelector(".av img").style.filter = noQ > 0.001 ? `grayscale(${noQ.toFixed(3)}) opacity(${(1 - noQ * 0.45).toFixed(3)})` : "none";
      nd.el.querySelector(".nm").style.color = noQ > 0.5 ? "#8e8e93" : "#1d1d1f";
      nd.el.querySelector(".av").style.boxShadow = `0 0 0 ${(6 * fitQ).toFixed(1)}px rgba(49,162,76,${(0.25 * fitQ).toFixed(3)}), 0 16px 40px rgba(30,40,90,.15)`;
      const badge = nd.el.querySelector(".badge");
      const bq = Math.max(fitQ, noQ);
      badge.textContent = phase === "fit" ? "✓" : phase === "nofit" ? "✕" : "";
      badge.style.background = phase === "fit" ? "#31a24c" : "#8e8e93";
      style(badge, bq, 0, 0, lerp(0.8, 1, bq));
      // status text crossfade
      const label = (ph) => (ph === "fit" ? (s?.oneSided ? "Fits · from her post" : "Fits") : ph === "nofit" ? "Not a fit" : ph === "talking" ? (s?.oneSided ? "Reading her post" : "Talking") : "Reaching…");
      const [a, b2] = [nd.el.querySelector(".st .a"), nd.el.querySelector(".st .b")];
      const q = s ? soft(prog(t, s.since, 0.4)) : 1;
      a.textContent = label(s?.prev ?? "reaching");
      b2.textContent = label(phase);
      b2.className = "b" + (phase === "fit" ? " fitc" : "");
      a.style.opacity = (1 - q).toFixed(3);
      b2.style.opacity = q.toFixed(3);
      // while the Muses talk: soft typing dots, and light flowing along the line toward whoever is listening
      const talking = phase === "talking" ? soft(prog(t, s.since, 0.4)) : phase === "reaching" ? 0 : 1 - soft(prog(t, s.since, 0.4));
      const dots = nd.el.querySelector(".dots");
      dots.style.opacity = (talking * o).toFixed(3);
      dots.style.transform = "translateX(-50%)";
      [...dots.children].forEach((d, k) => (d.style.opacity = (0.45 + 0.55 * (0.5 + 0.5 * Math.sin(t * 3.2 - k * 0.9))).toFixed(3)));
      if (nd.flow) {
        const fromMe = s?.speaker === "me";
        nd.flow.setAttribute("opacity", (0.85 * talking).toFixed(3));
        nd.flow.setAttribute("stroke-dashoffset", ((fromMe ? -1 : 1) * t * 70).toFixed(2));
      }
    }
  }
}
</script>
</body>
</html>

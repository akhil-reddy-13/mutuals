<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Mutuals demo studio</title>
<!--
  The stage for the demo video (1920x1080). record.mjs plays docs/video/mutuals.fountain on it:
  live-action scenes become storyboard frames, motion-graphics scenes become type/number/bubble cards, and
  phone scenes put the real app (an iframe of the running dev server) on a floating phone.
  Look: Apple product film. Seamless off-white, the phone as the hero, one statement at a time, glassy bubbles.
-->
<style>
  :root {
    --blue: #0866ff; --purple: #a033ff; --pink: #ff5c87; --ink: #1d1d1f; --muted: #6e6e73; --bg: #f5f5f7;
    --muse: linear-gradient(135deg, #0866ff 0%, #a033ff 55%, #ff5c87 100%);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; }
  html { margin: 0; width: 1920px; height: 1088px; overflow: hidden; background: #000; }
  body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; position: relative; font-family: var(--font); color: var(--ink); background: var(--bg); }
  /* Sync strip below the 1080p frame (cropped off in the final video): a white flash marks each voice line's start. */
  #sync { position: fixed; left: 0; top: 1080px; width: 1920px; height: 8px; background: #000; z-index: 999; }
  #sync b { position: absolute; left: 0; top: 0; width: 1920px; height: 8px; background: #fff; display: none; }
  .layer { position: absolute; inset: 0; transition: opacity .6s var(--ease), transform .6s var(--ease), filter .6s var(--ease); }
  .hidden { opacity: 0; pointer-events: none; }

  /* ---------- background: soft liquid-glass blobs and rising bubbles ---------- */
  #bg { overflow: hidden; }
  .blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .55; animation: drift 24s ease-in-out infinite alternate; }
  .blob.a { width: 900px; height: 900px; left: -260px; top: -380px; background: radial-gradient(circle at 30% 30%, #b9d6ff, #7fb0ff 60%, transparent 70%); }
  .blob.b { width: 760px; height: 760px; right: -240px; bottom: -340px; background: radial-gradient(circle at 60% 40%, #e7cfff, #c7a0ff 60%, transparent 70%); animation-duration: 30s; }
  .blob.c { width: 520px; height: 520px; right: 380px; top: -260px; background: radial-gradient(circle, #ffd3e0, transparent 70%); opacity: .45; animation-duration: 36s; }
  @keyframes drift { to { transform: translate(60px, 40px) scale(1.08); } }
  .glass { position: absolute; border-radius: 50%; background: radial-gradient(circle at 30% 25%, rgba(255,255,255,.95), rgba(255,255,255,.35) 22%, rgba(255,255,255,.08) 60%);
    border: 1.5px solid rgba(255,255,255,.85); box-shadow: inset 0 -10px 30px rgba(120,150,255,.18), 0 10px 40px rgba(60,80,160,.10); backdrop-filter: blur(6px);
    animation: rise linear infinite; }
  @keyframes rise { from { transform: translateY(0); } to { transform: translateY(-1400px); } }

  /* ---------- stage: phone + side column ---------- */
  #phoneWrap { position: absolute; left: 960px; top: 540px; width: 0; height: 0; transition: transform 1s var(--ease), opacity .6s var(--ease); }
  @keyframes liftIn { from { translate: 0 220px; opacity: 0; } to { translate: 0 0; opacity: 1; } }
  .lift { animation: liftIn 1s var(--ease) both; }
  #phone { position: absolute; left: -226px; top: -452px; width: 452px; height: 904px; border-radius: 74px; padding: 15px;
    background: linear-gradient(145deg, #3a3a3e, #8a8a90 18%, #2c2c30 40%, #6d6d72 70%, #2a2a2e);
    box-shadow: 0 60px 120px rgba(30, 40, 90, .28), 0 18px 40px rgba(0,0,0,.18), inset 0 0 0 1.5px rgba(255,255,255,.25);
    transition: transform 1s var(--ease); transform-origin: 50% 50%; }
  #screen { width: 422px; height: 874px; border-radius: 60px; overflow: hidden; background: #fff; position: relative; box-shadow: 0 0 0 4px #0b0b0c; }
  #status { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 8px 36px 0 44px; font-size: 17px; font-weight: 600; background: #fff; position: relative; }
  #status .island { position: absolute; left: 50%; top: 11px; width: 122px; height: 34px; margin-left: -61px; background: #0b0b0c; border-radius: 20px; }
  #status .icons { display: flex; gap: 7px; align-items: center; font-size: 15px; }
  #status .bat { width: 26px; height: 13px; border: 2px solid #111; border-radius: 4px; position: relative; }
  #status .bat::after { content: ""; position: absolute; inset: 1px; right: 5px; background: #111; border-radius: 1px; }
  #app { width: 390px; height: 776px; border: 0; transform: scale(1.0821); transform-origin: 0 0; background: #fff; display: block; }
  .tap { position: absolute; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: rgba(255,255,255,.35);
    border: 3px solid rgba(255,255,255,.95); box-shadow: 0 0 0 2px rgba(8,102,255,.35), 0 6px 20px rgba(0,0,0,.2); pointer-events: none; z-index: 60; animation: tap .6s ease-out forwards; }
  @keyframes tap { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }

  #stepper { position: absolute; top: 34px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; transition: opacity .5s; }
  .step { display: flex; align-items: center; gap: 10px; padding: 9px 20px 9px 10px; border-radius: 999px; font-size: 21px; font-weight: 600; color: var(--muted);
    background: rgba(255,255,255,.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.9); box-shadow: 0 2px 10px rgba(0,0,0,.05); transition: all .5s var(--ease); }
  .step i { font-style: normal; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: #e8e8ed; color: var(--muted); font-size: 17px; transition: all .5s var(--ease); }
  .step.on { color: #fff; background: var(--muse); box-shadow: 0 10px 30px rgba(160,51,255,.3); transform: scale(1.05); }
  .step.on i { background: rgba(255,255,255,.25); color: #fff; }
  .step.done i { background: var(--ink); color: #fff; }
  .stepline { width: 40px; height: 2px; background: #d2d2d7; }

  #side { position: absolute; left: 1010px; top: 150px; width: 800px; }
  #headline { font-size: 76px; line-height: 1.04; font-weight: 700; letter-spacing: -.025em; min-height: 10px; }
  #caption { font-size: 30px; line-height: 1.35; color: var(--muted); margin-top: 22px; max-width: 760px; }
  .word { display: inline-block; opacity: 0; transform: translateY(24px); filter: blur(8px); transition: opacity .55s var(--ease), transform .55s var(--ease), filter .55s var(--ease); }
  .word.in { opacity: 1; transform: none; filter: none; }
  .grad { background: var(--muse); -webkit-background-clip: text; background-clip: text; color: transparent; }

  #pops { position: absolute; inset: 0; pointer-events: none; }
  .pop { position: absolute; border-radius: 22px; box-shadow: 0 40px 90px rgba(30,40,90,.25), 0 8px 24px rgba(0,0,0,.12); transform-origin: 0 0;
    transition: left .9s var(--ease), top .9s var(--ease), width .9s var(--ease), transform .9s var(--ease), opacity .5s; background: #fff; }

  /* Muse network */
  #net { position: absolute; left: 1010px; top: 330px; width: 800px; height: 600px; transition: opacity .6s; }
  #net svg { position: absolute; inset: 0; overflow: visible; }
  .node { position: absolute; width: 132px; margin-left: -66px; text-align: center; transition: all .6s var(--ease); }
  .node .av { width: 112px; height: 112px; margin: 0 auto; border-radius: 50%; position: relative; padding: 5px; background: rgba(255,255,255,.75); backdrop-filter: blur(8px);
    box-shadow: 0 16px 40px rgba(30,40,90,.16); border: 1.5px solid rgba(255,255,255,.95); transition: all .6s var(--ease); }
  .node .av img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; transition: filter .6s; }
  .node .nm { margin-top: 10px; font-size: 21px; font-weight: 700; }
  .node .st { font-size: 17px; color: var(--muted); margin-top: 2px; height: 22px; }
  .node.me .av { width: 150px; height: 150px; padding: 7px; background: var(--muse); }
  .node.me { width: 170px; margin-left: -85px; }
  .node.fit .av { box-shadow: 0 0 0 6px rgba(49,162,76,.25), 0 16px 40px rgba(30,40,90,.16); }
  .node.fit .st { color: #1e7a34; font-weight: 600; }
  .node.nofit .av img { filter: grayscale(1) opacity(.55); }
  .node.nofit .nm { color: var(--muted); }
  .badge { position: absolute; right: -2px; bottom: 2px; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 22px; font-weight: 800; border: 3px solid #fff; transform: scale(0); transition: transform .5s var(--ease); }
  .node.fit .badge { background: #31a24c; transform: scale(1); }
  .node.nofit .badge { background: #8e8e93; transform: scale(1); }
  .typing { position: absolute; left: 50%; top: -30px; transform: translateX(-50%) scale(0); background: #fff; border-radius: 18px; padding: 8px 12px; display: flex; gap: 5px;
    box-shadow: 0 6px 18px rgba(0,0,0,.12); transition: transform .3s var(--ease); }
  .typing span { width: 8px; height: 8px; border-radius: 50%; background: #8e8e93; animation: blink 1.1s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  .node.talking .typing { transform: translateX(-50%) scale(1); }
  .packet { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--muse); box-shadow: 0 0 14px rgba(160,51,255,.6); }

  /* ---------- graphics ---------- */
  #gfx { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #gfxStack { display: flex; flex-direction: column; align-items: center; gap: 26px; max-width: 1500px; }
  .statement { font-size: 104px; line-height: 1.04; font-weight: 700; letter-spacing: -.03em; max-width: 1500px; }
  .gcap { font-size: 38px; color: var(--muted); line-height: 1.3; max-width: 1200px; }
  .stat { display: flex; align-items: center; gap: 90px; text-align: left; }
  .stat .num { font-size: 300px; font-weight: 800; letter-spacing: -.05em; line-height: .9; }
  .stat .txt { font-size: 46px; font-weight: 600; line-height: 1.22; max-width: 640px; }
  .stat .src { font-size: 20px; color: var(--muted); margin-top: 22px; font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(10, 34px); gap: 12px; margin-top: 34px; }
  .grid b { width: 34px; height: 34px; border-radius: 50%; background: #e3e3e8; transform: scale(0); transition: transform .45s var(--ease); }
  .grid b.on { background: var(--muse); box-shadow: 0 4px 12px rgba(160,51,255,.3); }
  .grid b.in { transform: scale(1); }
  .msg { position: absolute; font-size: 44px; padding: 22px 34px; border-radius: 36px; max-width: 640px; text-align: left; box-shadow: 0 14px 40px rgba(30,40,90,.10);
    transform: scale(.4) translateY(30px); opacity: 0; transition: transform .5s cubic-bezier(.34,1.56,.64,1), opacity .4s, filter .6s; }
  .msg.in { transform: none; opacity: 1; }
  .msg.them { background: #e9e9eb; color: #111; border-bottom-left-radius: 8px; }
  .msg.me { background: var(--blue); color: #fff; border-bottom-right-radius: 8px; }
  .msg.out { transform: scale(.2); opacity: 0; }
  .msg.secret { background: rgba(255,255,255,.7); color: #111; border: 1.5px solid rgba(255,255,255,.95); backdrop-filter: blur(10px); }
  .msg.secret.locked { filter: blur(9px); }
  .lock { position: absolute; font-size: 60px; transform: scale(0); transition: transform .5s cubic-bezier(.34,1.56,.64,1); }
  .lock.in { transform: scale(1); }
  .ring { width: 150px; height: 150px; border-radius: 50%; background: var(--muse); display: flex; align-items: center; justify-content: center; box-shadow: 0 30px 70px rgba(160,51,255,.35);
    transform: scale(0) rotate(-120deg); transition: transform 1s cubic-bezier(.34,1.56,.64,1); }
  .ring::after { content: ""; width: 96px; height: 96px; border-radius: 50%; background: var(--bg); }
  .ring.in { transform: none; }
  .wordmark { font-size: 170px; font-weight: 800; letter-spacing: -.045em; line-height: 1; }
  .models { display: flex; gap: 28px; margin-top: 10px; }
  .model { width: 500px; padding: 42px 40px 38px; border-radius: 36px; text-align: left; background: rgba(255,255,255,.72); backdrop-filter: blur(16px);
    border: 1.5px solid rgba(255,255,255,.95); box-shadow: 0 20px 60px rgba(30,40,90,.12); opacity: 0; transform: translateY(40px); transition: all .7s var(--ease); }
  .model.in { opacity: 1; transform: none; }
  .model .dot { width: 54px; height: 54px; border-radius: 50%; background: var(--muse); margin-bottom: 22px; box-shadow: 0 10px 24px rgba(160,51,255,.3); }
  .model h3 { margin: 0; font-size: 50px; letter-spacing: -.02em; }
  .model p { margin: 12px 0 0; font-size: 30px; color: var(--muted); line-height: 1.35; }

  /* ---------- live action (storyboard until it is filmed) ---------- */
  #live { background: radial-gradient(1400px 900px at 30% 25%, #3b3346 0%, #17141d 55%, #0b0a0f 100%); color: #fff; }
  #live .vf { position: absolute; inset: 70px 90px; pointer-events: none; }
  #live .vf i { position: absolute; width: 60px; height: 60px; border: 3px solid rgba(255,255,255,.55); }
  #live .vf i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; }
  #live .vf i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; }
  #live .vf i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; }
  #live .vf i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; }
  #live .rec { position: absolute; right: 130px; top: 104px; display: flex; align-items: center; gap: 10px; font-size: 20px; letter-spacing: .12em; color: rgba(255,255,255,.75); font-weight: 600; }
  #live .rec b { width: 14px; height: 14px; border-radius: 50%; background: #ff3b30; animation: blink 1.4s infinite; }
  #liveKicker { position: absolute; left: 150px; top: 150px; font-size: 26px; letter-spacing: .16em; text-transform: uppercase; color: #c9b8ff; font-weight: 700; }
  #liveAction { position: absolute; left: 150px; top: 210px; width: 1300px; font-size: 36px; line-height: 1.45; color: rgba(255,255,255,.7); font-style: italic; }
  #liveTag { position: absolute; left: 150px; bottom: 104px; font-size: 18px; letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.4); }
  #liveLine { position: absolute; left: 0; right: 0; bottom: 190px; text-align: center; padding: 0 220px; }
  #liveLine .who { font-size: 24px; letter-spacing: .2em; font-weight: 700; text-transform: uppercase; margin-bottom: 14px; }
  #liveLine .say { font-size: 58px; line-height: 1.25; font-weight: 600; letter-spacing: -.01em; text-shadow: 0 2px 20px rgba(0,0,0,.6); }
  #liveLine .paren { font-size: 28px; color: rgba(255,255,255,.55); font-style: italic; margin-bottom: 8px; }

  /* ---------- captions + transitions ---------- */
  #cap { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); max-width: 1500px; padding: 12px 26px; border-radius: 18px; font-size: 27px; line-height: 1.35;
    text-align: center; color: #fff; background: rgba(20,20,24,.72); backdrop-filter: blur(10px); transition: opacity .35s; z-index: 80; }
  #wipe { position: absolute; left: 960px; top: 540px; width: 0; height: 0; z-index: 90; pointer-events: none; }
  #wipe .circle { position: absolute; width: 2400px; height: 2400px; margin: -1200px 0 0 -1200px; border-radius: 50%; background: var(--muse); transform: scale(0); transition: transform .75s cubic-bezier(.7,0,.3,1); }
  #veil { position: absolute; inset: 0; z-index: 95; background: #000; opacity: 0; pointer-events: none; transition: opacity .8s; }
</style>
</head>
<body>
  <div id="bg" class="layer"><div class="blob a"></div><div class="blob b"></div><div class="blob c"></div><div id="bubbles"></div></div>

  <div id="stage" class="layer hidden">
    <div id="stepper"></div>
    <div id="phoneWrap"><div id="phone"><div id="screen">
      <div id="status"><span>9:41</span><span class="island"></span><span class="icons">5G <span class="bat"></span></span></div>
      <iframe id="app" title="Mutuals"></iframe>
    </div></div></div>
    <div id="side"><div id="headline"></div><div id="caption"></div></div>
    <div id="net" class="hidden"><svg id="netLines"></svg><div id="netNodes"></div></div>
    <div id="pops"></div>
  </div>

  <div id="gfx" class="layer hidden"><div id="gfxStack"></div></div>

  <div id="live" class="layer hidden"><div class="vf"><i></i><i></i><i></i><i></i></div><div class="rec"><b></b>REC</div><div id="liveTag">Storyboard · we film this scene live</div><div id="liveKicker"></div><div id="liveAction"></div><div id="liveLine"></div></div>

  <div id="cap" style="opacity:0"></div>
  <div id="wipe"><div class="circle"></div></div>
  <div id="veil"></div>
  <div id="sync"><b></b></div>

<script>
  const $ = (s) => document.querySelector(s);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
  /** *italic* / **bold** / words wrapped in ~tildes~ get the Muse gradient. */
  const fmt = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>").replace(/~(.+?)~/g, '<span class="grad">$1</span>');
  /** Split into words that fade/rise in one after another. */
  function words(el, text, stagger = 70) {
    el.innerHTML = fmt(text).split(/(\s+|<[^>]+>)/).map((w) => (/^\s+$|^<|^$/.test(w) ? w : `<span class="word">${w}</span>`)).join("");
    [...el.querySelectorAll(".word")].forEach((w, i) => setTimeout(() => w.classList.add("in"), 40 + i * stagger));
  }

  // Rising glass bubbles in the background
  for (let i = 0; i < 16; i++) {
    const b = document.createElement("div");
    const s = 30 + ((i * 37) % 110);
    b.className = "glass";
    Object.assign(b.style, { width: s + "px", height: s + "px", left: ((i * 131) % 1880) + "px", top: 1100 + ((i * 89) % 900) + "px", animationDuration: 26 + ((i * 7) % 22) + "s", animationDelay: -((i * 5) % 30) + "s", opacity: 0.75 });
    $("#bubbles").appendChild(b);
  }

  let current = null; // "phone" | "graphics" | "live"
  const layerOf = { phone: "#stage", graphics: "#gfx", live: "#live" };

  window.studio = {
    load(url) {
      return new Promise((r) => { $("#app").onload = () => r(); $("#app").src = url; });
    },
    frameBox() { const r = $("#app").getBoundingClientRect(); return { left: r.left, top: r.top, scale: r.width / 390 }; },

    /**
     * Switch to a scene kind with a transition: cut | dissolve | smash | match | wipe | fade.
     * `prep` runs at the moment the old shot is covered: { gfxClear, clearSide, live: [kicker, action] }.
     */
    async enter(kind, transition = "cut", prep = {}) {
      const next = $(layerOf[kind]);
      const prev = current ? $(layerOf[current]) : null;
      const swap = () => {
        if (prep.gfxClear) this.gfxClear();
        if (prep.clearSide) this.clearSide();
        if (prep.live) this.live(prep.live[0], prep.live[1]);
        if (prev && prev !== next) prev.classList.add("hidden");
        next.classList.remove("hidden");
        if (kind === "phone" && prev !== next) { const ph = $("#phone"); ph.classList.remove("lift"); ph.offsetHeight; ph.classList.add("lift"); }
      };
      const instant = (el, fn) => { el.style.transition = "none"; fn(); el.offsetHeight; el.style.transition = ""; };
      if (transition === "wipe") {
        const c = $("#wipe .circle");
        c.style.transform = "scale(1)";
        await wait(780);
        swap();
        c.style.transition = "transform .75s cubic-bezier(.7,0,.3,1), opacity .6s";
        c.style.opacity = "0";
        await wait(650);
        c.style.transition = "none"; c.style.transform = "scale(0)"; c.offsetHeight; c.style.opacity = "1"; c.style.transition = "";
      } else if (transition === "fade") {
        $("#veil").style.opacity = "1";
        await wait(850);
        swap();
        $("#veil").style.opacity = "0";
        await wait(300);
      } else if (transition === "dissolve" || (transition === "match" && prev !== next)) {
        if (prev === next) {
          // same layer: dip its content out and back in
          const inner = kind === "graphics" ? $("#gfxStack") : kind === "phone" ? $("#side") : $("#liveLine");
          inner.style.transition = "opacity .35s"; inner.style.opacity = "0";
          document.querySelectorAll("#gfx .msg, #gfx .lock").forEach((m) => { m.style.transition = "opacity .35s"; m.style.opacity = "0"; });
          await wait(380);
          swap();
          inner.style.opacity = "1";
        } else {
          next.style.transition = "none"; next.style.opacity = "0"; next.classList.remove("hidden"); next.offsetHeight;
          next.style.transition = ""; next.style.opacity = "";
          if (prev) prev.classList.add("hidden");
          swap();
          await wait(650);
        }
      } else {
        // cut / smash / match within the same layer: instant; smash adds a quick scale punch
        if (prev && prev !== next) instant(prev, () => prev.classList.add("hidden"));
        instant(next, () => { swap(); if (transition === "smash") next.style.transform = "scale(1.08)"; });
        if (transition === "smash") next.style.transform = "";
      }
      current = kind;
    },
    fadeOut() { $("#veil").style.opacity = "1"; },

    // ---------- phone scenes ----------
    /** Phone position: "center" or "left" (when there's a headline, a pop-out or the network on the right). */
    phone(pos = "center") {
      $("#phoneWrap").style.transform = pos === "left" ? "translateX(-340px)" : "none";
    },
    zoom(x, y, k = 1.6) {
      // Push in on a point of the screen (page coordinates), like a camera move.
      const r = $("#phone").getBoundingClientRect();
      const ox = ((x - r.left) / r.width) * 100, oy = ((y - r.top) / r.height) * 100;
      $("#phone").style.transformOrigin = `${ox}% ${oy}%`;
      $("#phone").style.transform = `scale(${k})`;
    },
    unzoom() { $("#phone").style.transform = "none"; },
    steps(list, active) {
      const el = $("#stepper");
      if (!list || !list.length) { el.style.opacity = "0"; return; }
      el.style.opacity = "1";
      el.innerHTML = list.map((s, i) => `${i ? '<div class="stepline"></div>' : ""}<div class="step ${i + 1 === active ? "on" : i + 1 < active ? "done" : ""}"><i>${i + 1}</i>${esc(s)}</div>`).join("");
    },
    headline(text) { words($("#headline"), text, 60); },
    caption(text) { words($("#caption"), text, 25); },
    clearSide() {
      $("#headline").innerHTML = ""; $("#caption").innerHTML = "";
      $("#pops").innerHTML = ""; $("#net").classList.add("hidden");
    },
    tap(x, y) {
      const t = document.createElement("div");
      t.className = "tap"; t.style.left = x + "px"; t.style.top = y + "px";
      document.body.appendChild(t); setTimeout(() => t.remove(), 700);
    },
    /** A piece of the app UI lifts out of the phone and settles, enlarged, on the right. */
    popOut(src, box, w, h) {
      const pops = $("#pops");
      const targetW = Math.max(520, Math.min(680, box.width * 1.7));
      const targetH = targetW * (h / w);
      // stack under the previous pop-outs; if there's no room, the oldest ones float away
      let top = 360;
      const live = [...pops.children].filter((p) => !p.dataset.gone);
      for (const p of live) top = Math.max(top, parseFloat(p.style.top) + parseFloat(p.dataset.h) + 26);
      while (top + targetH > 1010 && live.length) {
        const old = live.shift();
        old.dataset.gone = "1"; old.style.opacity = "0"; old.style.transform = "translateY(-40px) scale(.95)";
        top = 360;
        for (const p of live) { p.style.top = top + "px"; top += parseFloat(p.dataset.h) + 26; }
      }
      const img = document.createElement("img");
      img.className = "pop"; img.src = src; img.dataset.h = targetH;
      Object.assign(img.style, { left: box.x + "px", top: box.y + "px", width: box.width + "px" });
      pops.appendChild(img);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        Object.assign(img.style, { left: "1030px", top: top + "px", width: targetW + "px" });
        img.style.transform = "rotate(-1.2deg)";
      }));
      setTimeout(() => { img.style.transform = "none"; }, 950);
    },
    /** The Muse network: Jamie's Muse in the middle, everyone it is talking to around it. */
    network(nodes) {
      const net = $("#net");
      net.classList.remove("hidden");
      const cx = 400, cy = 330;
      const host = $("#netNodes");
      const others = nodes.filter((n) => !n.me);
      // fixed layout: me center-bottom, others on an arc above
      const placed = [{ ...nodes.find((n) => n.me), x: cx, y: cy + 150 }, ...others.map((n) => ({ ...n }))];
      placed[0].y = cy + 70;
      others.forEach((n, i) => {
        const a = (Math.PI * (i + 0.5)) / others.length;
        placed[i + 1].x = cx - Math.cos(a) * 340;
        placed[i + 1].y = cy - Math.sin(a) * 250 + 40;
      });
      $("#netLines").innerHTML = placed.slice(1).map((n) =>
        `<line x1="${cx}" y1="${placed[0].y + 30}" x2="${n.x}" y2="${n.y + 56}" stroke="${n.phase === "nofit" ? "#d1d1d6" : "url(#g)"}" stroke-width="${n.phase === "talking" ? 4 : 3}" stroke-dasharray="${n.phase === "reaching" ? "8 10" : "0"}" opacity="${n.phase === "nofit" ? .6 : .9}"/>`).join("") +
        `<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#0866ff"/><stop offset=".55" stop-color="#a033ff"/><stop offset="1" stop-color="#ff5c87"/></linearGradient></defs>`;
      for (const n of placed) {
        const id = "node-" + n.id;
        let el = document.getElementById(id);
        if (!el) {
          el = document.createElement("div");
          el.id = id;
          el.className = "node";
          el.innerHTML = `<div class="av"><img src="${n.avatar}"><div class="badge"></div><div class="typing"><span></span><span></span><span></span></div></div><div class="nm"></div><div class="st"></div>`;
          el.style.opacity = "0"; el.style.transform = "scale(.5)";
          host.appendChild(el);
          setTimeout(() => { el.style.opacity = "1"; el.style.transform = "none"; }, 30 + 120 * placed.indexOf(n));
        }
        el.className = `node ${n.me ? "me" : ""} ${n.phase ?? ""}`;
        el.style.left = n.x + "px"; el.style.top = n.y + "px";
        el.querySelector(".nm").textContent = n.label;
        el.querySelector(".st").textContent = n.status ?? "";
        el.querySelector(".badge").textContent = n.phase === "fit" ? "✓" : n.phase === "nofit" ? "✕" : "";
      }
      // packets travelling along the lines that are talking
      for (const n of placed.slice(1).filter((n) => n.phase === "talking")) {
        const p = document.createElement("div");
        p.className = "packet";
        const fromMe = n.speaker === "me";
        const a = fromMe ? { x: cx, y: placed[0].y + 30 } : { x: n.x, y: n.y + 56 };
        const b = fromMe ? { x: n.x, y: n.y + 56 } : { x: cx, y: placed[0].y + 30 };
        p.style.left = a.x + "px"; p.style.top = a.y + "px";
        net.appendChild(p);
        p.animate([{ left: a.x + "px", top: a.y + "px", opacity: 0 }, { opacity: 1, offset: .15 }, { left: b.x + "px", top: b.y + "px", opacity: 0 }], { duration: 900, easing: "ease-in-out" }).onfinish = () => p.remove();
      }
    },

    // ---------- graphics scenes ----------
    gfxClear() { $("#gfxStack").innerHTML = ""; document.querySelectorAll("#gfx .msg, #gfx .lock").forEach((m) => m.remove()); },
    statement(text) {
      const st = $("#gfxStack");
      let el = st.querySelector(".statement");
      if (!el) { el = document.createElement("div"); el.className = "statement"; st.appendChild(el); }
      st.querySelector(".gcap")?.remove();
      words(el, text, 80);
    },
    gcaption(text) {
      const st = $("#gfxStack");
      let el = st.querySelector(".gcap");
      if (!el) { el = document.createElement("div"); el.className = "gcap"; st.appendChild(el); }
      words(el, text, 30);
    },
    stat(value, text, source) {
      const st = $("#gfxStack");
      const m = String(value).match(/^([^\d]*)([\d.]+)(.*)$/);
      st.innerHTML = `<div class="stat"><div><div class="num grad">0</div><div class="grid"></div></div><div class="txt"><span class="t"></span><div class="src">${esc(source || "")}</div></div></div>`;
      const num = st.querySelector(".num");
      const target = m ? Number(m[2]) : 0;
      const t0 = performance.now();
      const tick = () => {
        const k = Math.min(1, (performance.now() - t0) / 1300);
        const e = 1 - Math.pow(1 - k, 3);
        num.textContent = m ? `${m[1]}${Math.round(target * e)}${m[3]}` : value;
        if (k < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
      words(st.querySelector(".t"), text, 45);
      const grid = st.querySelector(".grid");
      const on = Math.round(target);
      for (let i = 0; i < 100; i++) {
        const b = document.createElement("b");
        if (i < on) b.className = "on";
        grid.appendChild(b);
        setTimeout(() => b.classList.add("in"), 200 + i * 12);
      }
    },
    /** Chat bubbles pop in all over the screen: the same questions, with strangers, over and over. */
    bubbles(list) {
      const host = $("#gfx");
      const spots = [[120, 150], [1180, 120], [260, 420], [1290, 380], [140, 760], [1150, 700], [640, 250], [700, 880], [560, 560], [1460, 880]];
      list.forEach((t, i) => {
        const m = document.createElement("div");
        m.className = `msg ${i % 3 === 2 ? "me" : "them"}`;
        m.textContent = t;
        const [x, y] = spots[i % spots.length];
        Object.assign(m.style, { left: x + "px", top: y + "px" });
        host.appendChild(m);
        setTimeout(() => m.classList.add("in"), 150 + i * 330);
      });
    },
    popBubbles() { document.querySelectorAll("#gfx .msg:not(.secret)").forEach((m, i) => setTimeout(() => m.classList.add("out"), i * 60)); },
    /** Things nobody posts: they appear, then blur behind a lock. */
    secrets(list) {
      const host = $("#gfx");
      const spots = [[220, 300], [1060, 230], [600, 640]];
      list.forEach((t, i) => {
        const m = document.createElement("div");
        m.className = "msg secret";
        m.textContent = t;
        const [x, y] = spots[i % spots.length];
        Object.assign(m.style, { left: x + "px", top: y + "px", fontSize: "54px" });
        host.appendChild(m);
        setTimeout(() => m.classList.add("in"), 150 + i * 380);
        setTimeout(() => {
          m.classList.add("locked");
          const l = document.createElement("div");
          l.className = "lock"; l.textContent = "🔒";
          const r = m.getBoundingClientRect();
          Object.assign(l.style, { left: r.left + r.width / 2 - 30 + "px", top: r.top + r.height / 2 - 40 + "px" });
          host.appendChild(l);
          requestAnimationFrame(() => l.classList.add("in"));
        }, 1700 + i * 300);
      });
    },
    logo() {
      const st = $("#gfxStack");
      st.innerHTML = `<div class="ring"></div><div class="wordmark"></div>`;
      requestAnimationFrame(() => st.querySelector(".ring").classList.add("in"));
      setTimeout(() => words(st.querySelector(".wordmark"), "Mutuals", 0), 450);
    },
    models(list) {
      const st = $("#gfxStack");
      const wrap = document.createElement("div");
      wrap.className = "models";
      wrap.innerHTML = list.map((m) => `<div class="model"><div class="dot"></div><h3>${esc(m[0])}</h3><p>${esc(m[1])}</p></div>`).join("");
      st.appendChild(wrap);
      [...wrap.children].forEach((c, i) => setTimeout(() => c.classList.add("in"), 150 + i * 260));
    },

    // ---------- live action ----------
    live(kicker, action) {
      $("#liveKicker").textContent = kicker;
      $("#liveAction").textContent = action || "";
      $("#liveLine").innerHTML = "";
    },
    liveLine(who, color, text, paren) {
      const el = $("#liveLine");
      el.style.opacity = "0";
      setTimeout(() => {
        el.innerHTML = `<div class="who" style="color:${color}">${esc(who)}</div>${paren ? `<div class="paren">${esc(paren)}</div>` : ""}<div class="say">${fmt(text)}</div>`;
        el.style.transition = "opacity .25s"; el.style.opacity = "1";
      }, 120);
    },

    /** Flash the sync marker (see record.mjs mix()). */
    sync() { const b = $("#sync b"); b.style.display = "block"; setTimeout(() => (b.style.display = "none"), 140); },

    // ---------- captions ----------
    cap(text) {
      const c = $("#cap");
      if (!text) { c.style.opacity = "0"; return; }
      c.textContent = text; c.style.opacity = "1";
    },
  };
</script>
</body>
